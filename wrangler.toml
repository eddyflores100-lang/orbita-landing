# =====================================================
# Órbita — Cloudflare Pages config
# =====================================================
# This file configures Cloudflare Pages deployment.
# Project will be live at https://orbita-9wl.pages.dev
# =====================================================

name = "orbita"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Environment variables that are safe to be public (NO secrets here)
# For secrets, use `wrangler pages secret put KEY` or the Cloudflare dashboard
[vars]
NEXT_PUBLIC_APP_URL = "https://orbita-9wl.pages.dev"
